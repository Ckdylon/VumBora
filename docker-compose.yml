services:
  servidor:
    build: .
    command: ./servidor
    ports:
      - "8080:8080" #expoe a rede fiica para outras maquinas
    networks:
      - rede-vumbora

  motorista:
    build: .
    command: ./motorista
    environment:
      - SERVER_ADDR=servidor:8080 #interno do docker
    stdin_open: true     #habilita a entrad interativa do teclado
    tty: true
    networks:
      - rede-vumbora
    depends_on:
      - servidor

  passageiro:
    build: .
    command: ./passageiro
    environment:
      - SERVER_ADDR=servidor:8080
    stdin_open: true
    tty: true
    networks:
      - rede-vumbora
    depends_on:
      - servidor

networks:
  rede-vumbora:
    driver: bridge