services:
  empresa-a:
    build: .
    container_name: vumbora-empresa-a
    environment:
      - EMPRESA_ID=EMP_A
      - TCP_ADDR=:8080
      - HTTP_ADDR=:8081
      - DATA_FILE=/data/emp_a.json
      - PEERS=EMP_B=http://empresa-b:8081,EMP_C=http://empresa-c:8081
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - dados_emp_a:/data

  empresa-b:
    build: .
    container_name: vumbora-empresa-b
    environment:
      - EMPRESA_ID=EMP_B
      - TCP_ADDR=:8080
      - HTTP_ADDR=:8081
      - DATA_FILE=/data/emp_b.json
      - PEERS=EMP_A=http://empresa-a:8081,EMP_C=http://empresa-c:8081
    ports:
      - "8090:8080"
      - "8091:8081"
    volumes:
      - dados_emp_b:/data

  empresa-c:
    build: .
    container_name: vumbora-empresa-c
    environment:
      - EMPRESA_ID=EMP_C
      - TCP_ADDR=:8080
      - HTTP_ADDR=:8081
      - DATA_FILE=/data/emp_c.json
      - PEERS=EMP_A=http://empresa-a:8081,EMP_B=http://empresa-b:8081
    ports:
      - "8100:8080"
      - "8101:8081"
    volumes:
      - dados_emp_c:/data

volumes:
  dados_emp_a:
  dados_emp_b:
  dados_emp_c: